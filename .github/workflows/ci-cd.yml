name: Healthcare Analytics Platform - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

env:
  PYTHON_VERSION: '3.11'
  TERRAFORM_VERSION: '1.6.6'

jobs:
  # ── 1. Lint & Unit Tests ──────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Lint with flake8
        run: |
          flake8 databricks/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E302,E303,E401,F401,E711,W291,W293,E266,E265,E262,W391,E128,E121,E123,E126,E226,E131,E251,E261 \
            --exclude=__pycache__
        continue-on-error: true

      - name: Create test results directory
        run: mkdir -p test-results

      - name: Run unit and data quality tests
        run: |
          pytest tests/unit/ tests/data_quality/ \
            -v --tb=short \
            --junitxml=test-results/unit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: warn

  # ── 2. Terraform Validate ─────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ── 3. Deploy Dev (only when DEPLOY_ENABLED=true) ─────────────
  deploy-dev:
    name: Deploy to Dev
    needs: [test, terraform-validate]
    runs-on: ubuntu-latest
    environment: dev
    if: |
      (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'dev') &&
      vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init + Apply (Dev)
        working-directory: terraform
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform init -backend-config="key=dev.healthcare.tfstate"
          terraform apply -auto-approve \
            -var="environment=dev" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -var="synapse_sql_password=${{ secrets.SYNAPSE_SQL_PASSWORD }}"

      - name: Deploy Databricks Notebooks
        run: |
          pip install databricks-cli
          echo "${{ secrets.DATABRICKS_HOST_DEV }}" > /tmp/db_host
          echo "${{ secrets.DATABRICKS_TOKEN_DEV }}" > /tmp/db_token
          databricks --version

  # ── 4. Deploy Test ────────────────────────────────────────────
  deploy-test:
    name: Deploy to Test
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test
    if: |
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'test') &&
      vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init + Apply (Test)
        working-directory: terraform
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform init -backend-config="key=test.healthcare.tfstate"
          terraform apply -auto-approve \
            -var="environment=test" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -var="synapse_sql_password=${{ secrets.SYNAPSE_SQL_PASSWORD }}"

  # ── 5. Deploy Prod ────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Prod
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod
    if: |
      github.event.inputs.environment == 'prod' &&
      vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init + Apply (Prod)
        working-directory: terraform
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
        run: |
          terraform init -backend-config="key=prod.healthcare.tfstate"
          terraform apply -auto-approve \
            -var="environment=prod" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ secrets.ARM_TENANT_ID }}" \
            -var="synapse_sql_password=${{ secrets.SYNAPSE_SQL_PASSWORD }}"
